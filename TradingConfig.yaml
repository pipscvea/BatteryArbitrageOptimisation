trading:
  starting_balance: 100000     # £ notional, used only to express returns as a percentage
  transaction_cost_per_mwh: 0.5   # £ per MWh traded (fees/spread proxy)
  # Minimum expected edge (£/MWh, net of efficiency + costs) required to open a trade.
  # This is the commercial gate: below it, forecast signal is not worth acting on.
  min_edge_per_mwh: 3.0
